name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bingo
          POSTGRES_USER: bingo
          POSTGRES_PASSWORD: bingo_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bingo -d bingo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Bingo.slnx

      - name: Verify formatting
        run: dotnet format Bingo.slnx --no-restore --verify-no-changes

      - name: Build
        run: dotnet build Bingo.slnx --configuration Release --no-restore

      - name: Prepare browser-test database
        run: dotnet run --project src/Bingo.Web --configuration Release --no-build -- --apply-catalogue-snapshot

      - name: Test
        run: dotnet test Bingo.slnx --configuration Release --no-build --logger trx --collect "XPlat Code Coverage"

  publish-image:
    needs: build-and-test
    if: ${{ needs.build-and-test.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Normalize image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          [[ "$image" =~ ^ghcr\.io/[a-z0-9._-]+/[a-z0-9._-]+$ ]] || { echo "Invalid repository image name" >&2; exit 1; }
          echo "name=$image" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: src/Bingo.Web/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Write candidate receipt
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid source SHA" >&2; exit 1; }
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Invalid image digest" >&2; exit 1; }
          mkdir -p candidate
          jq -n \
            --arg repository "$REPOSITORY" \
            --arg image "$IMAGE_NAME" \
            --arg digest "$IMAGE_DIGEST" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg platform "linux/amd64" \
            --arg ciRunId "$RUN_ID" \
            --arg ciRunUrl "$RUN_URL" \
            --arg createdAtUtc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion: 1, repository: $repository, image: $image, digest: $digest, sourceSha: $sourceSha, platform: $platform, ciRunId: ($ciRunId | tonumber), ciRunUrl: $ciRunUrl, createdAtUtc: $createdAtUtc}' \
            > candidate/candidate.json

      - name: Upload candidate receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-candidate-${{ github.sha }}
          path: candidate/candidate.json
          if-no-files-found: error
          retention-days: 14
