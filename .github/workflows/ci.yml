name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  javascript-tests:
    name: JavaScript and Playwright tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Not a release gate yet (user decision, 8 October 2026): known JS failures are
    # recorded and fixed with the JS job split. Remove continue-on-error then.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # Duration-balanced by scripts/browser-test-timings.json.
        shard: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    permissions:
      contents: read
    env:
      BINGO_ADMIN_STALE_EVIDENCE_DIRECTORY: ${{ github.workspace }}/artifacts/js-fixtures
      BROWSER_TEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
      PLAYWRIGHT_CHANNEL: chromium
      SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Plan this shard
        id: plan
        run: node scripts/run-browser-tests.cjs --shard-info "$BROWSER_TEST_SHARD" >> "$GITHUB_OUTPUT"
      - name: Set up .NET
        if: steps.plan.outputs.dotnet == 'true'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Install pinned package manager and dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        if: steps.plan.outputs.engines != ''
        # Only this shard's engines. One unchanged legacy test explicitly selects Chrome.
        env:
          ENGINES: ${{ steps.plan.outputs.engines }}
        run: pnpm exec playwright install --with-deps $ENGINES
      - name: Generate controlled account HTML fixtures
        if: steps.plan.outputs.staleFixtures == 'true'
        run: dotnet test tests/Bingo.IntegrationTests/Bingo.IntegrationTests.csproj --configuration Release --filter FullyQualifiedName~AccountConfirmationRejectsCompletedInterveningChangesThenAcceptsFreshAction
      - name: Build controlled real-layout fixture
        if: steps.plan.outputs.dotnet == 'true'
        run: dotnet build tests/AdminDesignParityFixture/AdminDesignParityFixture.csproj --configuration Release
      - name: Run this shard's JavaScript tests
        continue-on-error: true
        timeout-minutes: 15
        run: pnpm test:js
      - name: Compare rendered reference and real layout in both engines
        if: steps.plan.outputs.parity == 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: pnpm test:parity
      - name: Upload JavaScript results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: javascript-results-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            artifacts/js-tests/
            artifacts/admin-parity/
          if-no-files-found: warn
          retention-days: 7

  other-tests:
    name: Other tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bingo
          POSTGRES_USER: bingo
          POSTGRES_PASSWORD: bingo_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bingo -d bingo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Bingo.slnx

      - name: Verify formatting
        run: dotnet format Bingo.slnx --no-restore --verify-no-changes

      - name: Build
        run: dotnet build Bingo.slnx --configuration Release --no-restore

      - name: Prepare browser-test database
        run: dotnet run --project src/Bingo.Web --configuration Release --no-build -- --apply-catalogue-snapshot

      - name: Test Domain
        id: test_domain
        continue-on-error: true
        run: dotnet test tests/Bingo.Domain.Tests/Bingo.Domain.Tests.csproj --configuration Release --no-build --results-directory TestResults/domain --logger "trx;LogFileName=domain.trx" --collect "XPlat Code Coverage"

      - name: Test Application
        id: test_application
        continue-on-error: true
        run: dotnet test tests/Bingo.Application.Tests/Bingo.Application.Tests.csproj --configuration Release --no-build --results-directory TestResults/application --logger "trx;LogFileName=application.trx" --collect "XPlat Code Coverage"

      - name: Test Browser
        id: test_browser
        continue-on-error: true
        run: dotnet test tests/Bingo.BrowserTests/Bingo.BrowserTests.csproj --configuration Release --no-build --results-directory TestResults/browser --logger "trx;LogFileName=browser.trx" --collect "XPlat Code Coverage"

      - name: Fail if any test project failed
        env:
          DOMAIN_OUTCOME: ${{ steps.test_domain.outcome }}
          APPLICATION_OUTCOME: ${{ steps.test_application.outcome }}
          BROWSER_OUTCOME: ${{ steps.test_browser.outcome }}
        run: |
          if [[ "$DOMAIN_OUTCOME" == "failure" || "$APPLICATION_OUTCOME" == "failure" || "$BROWSER_OUTCOME" == "failure" ]]; then
            exit 1
          fi

      - name: Upload other test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: other-test-results-${{ github.run_id }}
          path: TestResults
          if-no-files-found: warn
          retention-days: 14

  integration-discovery:
    # Builds the Integration tests itself, in parallel with other-tests, so the
    # shards do not wait for formatting and the other test projects.
    name: Discover Integration shards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    outputs:
      matrix: ${{ steps.partition.outputs.matrix }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore Integration test project
        run: dotnet restore tests/Bingo.IntegrationTests/Bingo.IntegrationTests.csproj

      - name: Build Integration test project
        run: dotnet build tests/Bingo.IntegrationTests/Bingo.IntegrationTests.csproj --configuration Release --no-restore

      - name: Upload Integration build outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-build-${{ github.run_id }}
          path: |
            src/**/bin/Release/**
            src/**/obj/**
            tests/**/bin/Release/**
            tests/**/obj/**
          if-no-files-found: error
          retention-days: 1

      - name: Discover and validate Integration partition
        id: partition
        # Duration-balanced by .github/scripts/integration-test-timings.tsv.
        run: bash .github/scripts/partition-integration-tests.sh tests/Bingo.IntegrationTests/Bingo.IntegrationTests.csproj Release 8 "$GITHUB_OUTPUT"

  integration:
    name: Integration shard ${{ matrix.shard }}
    needs: integration-discovery
    if: ${{ needs.integration-discovery.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.integration-discovery.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bingo
          POSTGRES_USER: bingo
          POSTGRES_PASSWORD: bingo_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bingo -d bingo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore Integration test project
        run: dotnet restore tests/Bingo.IntegrationTests/Bingo.IntegrationTests.csproj

      - name: Download Integration build outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: integration-build-${{ github.run_id }}
          path: .

      - name: Test Integration shard
        env:
          INTEGRATION_FILTER: ${{ matrix.filter }}
          EXPECTED_CASES: ${{ matrix.expected }}
        timeout-minutes: 45
        run: |
          echo "Running $EXPECTED_CASES discovered Integration cases in shard ${{ matrix.shard }} (~${{ matrix.seconds }}s planned)"
          dotnet test tests/Bingo.IntegrationTests/Bingo.IntegrationTests.csproj --configuration Release --no-build --filter "$INTEGRATION_FILTER" --results-directory "TestResults/integration-${{ matrix.shard }}" --logger "trx;LogFileName=integration-${{ matrix.shard }}.trx" --collect "XPlat Code Coverage"

      - name: Upload Integration shard results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-results-${{ matrix.shard }}-${{ github.run_id }}
          path: TestResults/integration-${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: 14

  build-and-test:
    name: build-and-test
    if: ${{ always() }}
    needs:
      - other-tests
      - integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Fail if any test project failed
        env:
          OTHER_TESTS_OUTCOME: ${{ needs.other-tests.result }}
          INTEGRATION_OUTCOME: ${{ needs.integration.result }}
        run: |
          if [[ "$OTHER_TESTS_OUTCOME" != "success" || "$INTEGRATION_OUTCOME" != "success" ]]; then
            exit 1
          fi

  publish-image:
    needs: build-and-test
    if: ${{ needs.build-and-test.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Normalize image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          [[ "$image" =~ ^ghcr\.io/[a-z0-9._-]+/[a-z0-9._-]+$ ]] || { echo "Invalid repository image name" >&2; exit 1; }
          echo "name=$image" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: src/Bingo.Web/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          secrets: |
            sixlabors_license_key=${{ secrets.SIXLABORS_LICENSE_KEY }}
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Write candidate receipt
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid source SHA" >&2; exit 1; }
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Invalid image digest" >&2; exit 1; }
          mkdir -p candidate
          jq -n \
            --arg repository "$REPOSITORY" \
            --arg image "$IMAGE_NAME" \
            --arg digest "$IMAGE_DIGEST" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg platform "linux/amd64" \
            --arg ciRunId "$RUN_ID" \
            --arg ciRunUrl "$RUN_URL" \
            --arg createdAtUtc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion: 1, repository: $repository, image: $image, digest: $digest, sourceSha: $sourceSha, platform: $platform, ciRunId: ($ciRunId | tonumber), ciRunUrl: $ciRunUrl, createdAtUtc: $createdAtUtc}' \
            > candidate/candidate.json

      - name: Upload candidate receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-candidate-${{ github.sha }}
          path: candidate/candidate.json
          if-no-files-found: error
          retention-days: 14
