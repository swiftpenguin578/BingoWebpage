name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Bingo.slnx

      - name: Verify formatting
        run: dotnet format Bingo.slnx --no-restore --verify-no-changes

      - name: Build
        run: dotnet build Bingo.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Bingo.slnx --configuration Release --no-build --logger trx --collect "XPlat Code Coverage"
