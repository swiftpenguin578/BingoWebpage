name: Production Promotion

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Promotion receipt only, or manually approve and start deployment
        required: true
        type: choice
        options: [promote, deploy]
        default: promote
      source_sha:
        description: Full source commit SHA from a successful main CI run
        required: true
        type: string
      image_digest:
        description: "Immutable image digest, including the sha256: prefix"
        required: true
        type: string
      ci_run_id:
        description: Numeric CI workflow run ID that published the candidate
        required: true
        type: string

permissions: {}

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  validate-candidate:
    name: Validate candidate for selected action
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require main ref
        run: test "$GITHUB_REF" = refs/heads/main

      - name: Validate promotion inputs
        env:
          MODE: ${{ inputs.mode }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          [[ "$MODE" == promote || "$MODE" == deploy ]] || { echo "mode must be promote or deploy" >&2; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "source_sha must be 40 hexadecimal characters" >&2; exit 1; }
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || { echo "image_digest must be sha256: followed by 64 hexadecimal characters" >&2; exit 1; }
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]] || { echo "ci_run_id must be numeric" >&2; exit 1; }

      - name: Verify successful CI run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          api_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}"
          run_json="${RUNNER_TEMP}/ci-run.json"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$api_url" > "$run_json"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg ciRunId "$CI_RUN_ID" \
            '.repository.full_name == $repository and
             .path == ".github/workflows/ci.yml" and
             .name == "CI" and
             .event == "push" and
             .head_branch == "main" and
             .head_sha == $sourceSha and
             .status == "completed" and
             .conclusion == "success" and
             (.id | tostring) == $ciRunId' \
            "$run_json" > /dev/null

      - name: Download exact candidate receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: production-candidate-${{ inputs.source_sha }}
          path: candidate
          repository: ${{ github.repository }}
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}

      - name: Verify candidate receipt
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          candidate_path="candidate/candidate.json"
          test -f "$candidate_path"
          [[ "$(find candidate -type f | wc -l | tr -d ' ')" == "1" ]] || { echo "Candidate artifact must contain exactly one file" >&2; exit 1; }
          expected_image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          expected_run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg image "$expected_image" \
            --arg digest "$IMAGE_DIGEST" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg platform "linux/amd64" \
            --arg ciRunId "$CI_RUN_ID" \
            --arg ciRunUrl "$expected_run_url" \
            'type == "object" and
             (keys | sort) == ["ciRunId", "ciRunUrl", "createdAtUtc", "digest", "image", "platform", "repository", "schemaVersion", "sourceSha"] and
             .schemaVersion == 1 and
             .repository == $repository and
             .image == $image and
             (.image | contains(":") | not) and
             .digest == $digest and
             .sourceSha == $sourceSha and
             .platform == $platform and
             (.ciRunId | tostring) == $ciRunId and
             .ciRunUrl == $ciRunUrl and
             (.createdAtUtc | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))' \
            "$candidate_path" > /dev/null

  record-promotion:
    name: Record non-mutating promotion
    needs: validate-candidate
    if: ${{ inputs.mode == 'promote' && needs.validate-candidate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Write promotion receipt
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          ACTOR: ${{ github.actor }}
          PROMOTION_RUN_ID: ${{ github.run_id }}
          PROMOTION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          expected_image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          candidate_run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}"
          mkdir -p promotion
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg image "$expected_image" \
            --arg digest "$IMAGE_DIGEST" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg platform "linux/amd64" \
            --arg ciRunId "$CI_RUN_ID" \
            --arg ciRunUrl "$candidate_run_url" \
            --arg candidateArtifact "production-candidate-${SOURCE_SHA}" \
            --arg promotingActor "$ACTOR" \
            --arg promotionRunId "$PROMOTION_RUN_ID" \
            --arg promotionRunUrl "$PROMOTION_RUN_URL" \
            --arg promotedAtUtc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion: 1, repository: $repository, image: $image, digest: $digest, sourceSha: $sourceSha, platform: $platform, candidateCiRunId: ($ciRunId | tonumber), candidateCiRunUrl: $ciRunUrl, candidateArtifact: $candidateArtifact, promotingActor: $promotingActor, promotionWorkflowRunId: ($promotionRunId | tonumber), promotionWorkflowRunUrl: $promotionRunUrl, promotedAtUtc: $promotedAtUtc}' \
            > promotion/promotion.json

      - name: Upload promotion receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-promotion-${{ inputs.source_sha }}-${{ inputs.ci_run_id }}
          path: promotion/promotion.json
          if-no-files-found: error
          retention-days: 30

  deploy-production:
    name: Deploy manually approved candidate
    needs: validate-candidate
    if: ${{ inputs.mode == 'deploy' && needs.validate-candidate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Deploy through pinned host command
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          PROMOTION_ID: ${{ github.run_id }}
          DEPLOYMENT_ID: ${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9._:-]+$ ]] || { echo "Invalid deployment host" >&2; exit 1; }
          [[ "$SSH_PORT" =~ ^[0-9]+$ && "$SSH_PORT" -ge 1 && "$SSH_PORT" -le 65535 ]] || { echo "Invalid deployment port" >&2; exit 1; }
          [[ "$SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Invalid deployment user" >&2; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "Invalid source SHA" >&2; exit 1; }
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || { echo "Invalid image digest" >&2; exit 1; }
          [[ -n "$SSH_KNOWN_HOSTS" && -n "$SSH_PRIVATE_KEY" ]] || { echo "SSH transport secrets are incomplete" >&2; exit 1; }
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
          ssh-keygen -lf "$ssh_dir/known_hosts" >/dev/null
          image_name=$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          [[ "$image_name" =~ ^ghcr\.io/[a-z0-9._-]+/[a-z0-9._-]+$ ]] || { echo "Invalid GHCR image name" >&2; exit 1; }
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -i "$ssh_dir/id_ed25519" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            sudo --non-interactive /usr/local/sbin/bingo-deploy \
              --source-sha "$SOURCE_SHA" --image "$image_name" --image-digest "$IMAGE_DIGEST" \
              --ci-run-id "$CI_RUN_ID" --promotion-id "$PROMOTION_ID" \
              --deployment-id "$DEPLOYMENT_ID" --actor "$ACTOR"
