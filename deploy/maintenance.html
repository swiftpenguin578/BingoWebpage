<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="30">
<meta name="robots" content="noindex">
<title>Updating - Siden opdateres</title>
<style>
:root{color-scheme:light dark;--canvas:#fff9ec;--ink:#111528;--muted:#646779;--header:#293d91;--rule:#dcd6c8}
@media (prefers-color-scheme:dark){:root{--canvas:#1b1a1d;--ink:#f4eedf;--muted:#b8b1a8;--header:#111216;--rule:#434146}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--canvas);color:var(--ink);font:16px/1.5 Barlow,"Helvetica Neue",Arial,sans-serif}
header{height:72px;background:var(--header);color:#fff9ec;display:flex;align-items:center;padding:0 5%;font-size:22px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 5%}
section{max-width:520px;width:100%;border-top:4px solid var(--header);padding-top:24px}
h1{margin:0 0 6px;font-size:28px;line-height:1.2}
p{margin:0 0 24px;color:var(--muted)}
h1+p{color:var(--ink)}
hr{border:0;border-top:1px solid var(--rule);margin:0 0 24px}
small{color:var(--muted)}
</style>
</head>
<body>
<header>Bingo</header>
<main>
<section>
<h1>The site is being updated</h1>
<p>The site is being updated &mdash; back in a few minutes.</p>
<hr>
<h1 lang="da">Siden opdateres</h1>
<p lang="da">Siden opdateres &mdash; tilbage om f&aring; minutter.</p>
<small>This page reloads automatically. / Siden genindl&aelig;ses automatisk.</small>
</section>
</main>
</body>
</html>
