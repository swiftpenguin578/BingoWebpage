<template data-admin-template="confirmation"><h2 class="m-title" data-confirm-title></h2>
<p class="m-body" data-confirm-description></p>
<div class="m-actions"><button type="button" class="btn" data-confirm-cancel autofocus></button><button type="button" class="btn btn-primary" data-confirm-accept><span class="spin" hidden></span><span data-component-text></span></button></div>
</template>
<template data-admin-template="toast"><div class="toast" data-toast role="status"><svg class="ic t-ic" viewBox="0 0 16 16" aria-hidden="true" data-icon="check">
        <path d="M3.8 8.4 6.6 11.2 12.2 5"/>
</svg>
<span class="grow" data-component-text></span><button type="button" class="toast-act" hidden></button><button type="button" class="toast-x" data-toast-close aria-label="Dismiss notification"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true" data-icon="close">
        <path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/>
</svg>
</button></div>
</template>
<template data-admin-template="toast-error"><div class="toast is-error" data-toast role="alert"><svg class="ic t-ic" viewBox="0 0 16 16" aria-hidden="true" data-icon="error">
        <circle cx="8" cy="8" r="6"/><path d="M8 5v3.5M8 11h.01"/>
</svg>
<span class="grow" data-component-text></span><button type="button" class="toast-act" hidden></button><button type="button" class="toast-x" data-toast-close aria-label="Dismiss notification"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true" data-icon="close">
        <path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/>
</svg>
</button></div>
</template>
<template data-admin-template="field-note"><div class="field-note" data-conflict-for=""><svg class="ic" viewBox="0 0 16 16" aria-hidden="true" data-icon="info">
        <circle cx="8" cy="8" r="6"/><path d="M8 7.2v3.8M8 5h.01"/>
</svg>
<span><span data-component-text></span> <button type="button" class="text-btn" data-use-theirs=""></button> </span></div>
</template>
<template data-admin-template="field-error"><div class="field-err field-validation-valid" id="error-"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true" data-icon="error">
        <circle cx="8" cy="8" r="6"/><path d="M8 5v3.5M8 11h.01"/>
</svg>
<span data-component-text></span></div>
</template>
<template data-admin-template="banner-info"><div class="banner is-info" role="status"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true" data-icon="info">
        <circle cx="8" cy="8" r="6"/><path d="M8 7.2v3.8M8 5h.01"/>
</svg>
<span class="grow"><b data-component-lead hidden="hidden"></b><span data-component-text></span></span></div>
</template>
<template data-admin-template="banner-error"><div class="banner is-error" role="alert"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true" data-icon="error">
        <circle cx="8" cy="8" r="6"/><path d="M8 5v3.5M8 11h.01"/>
</svg>
<span class="grow"><b data-component-lead hidden="hidden"></b><span data-component-text></span></span></div>
</template>
<template data-admin-template="banner-warning"><div class="banner is-warning" role="alert"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true" data-icon="warning">
        <path d="M8 2.5 14 13H2z"/><path d="M8 6.5v3M8 11.2h.01"/>
</svg>
<span class="grow"><b data-component-lead hidden="hidden"></b><span data-component-text></span></span></div>
</template>
<template data-admin-template="banner-uncertain"><div class="banner is-warning" role="alert"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true" data-icon="uncertain">
        <circle cx="8" cy="8" r="6"/><path d="M8 4.8v3.6M8 11h.01"/>
</svg>
<span class="grow"><b data-component-lead hidden="hidden"></b><span data-component-text></span></span></div>
</template>
<template data-admin-template="loading"><div class="card form-card" aria-busy="true" aria-label="Loading">
    <div class="sk-block"><div class="sk" style="width:22%"></div><div class="sk" style="width:100%;height:34px;margin-top:14px;border-radius:8px"></div><div class="sk" style="width:100%;height:120px;margin-top:18px;border-radius:8px"></div></div>
    <div class="sk-block"><div class="sk" style="width:18%"></div><div class="sk" style="width:46%;height:34px;margin-top:14px;border-radius:8px"></div></div>
    <div class="sk-block" style="border-bottom:0"><div class="sk" style="width:16%"></div><div class="sk" style="width:70%;height:34px;margin-top:14px;border-radius:8px"></div></div>
</div>
</template>
<template data-admin-template="load-failure"><div class="card form-card"><div class="empty is-error" role="alert"><div class="empty-ic"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true" data-icon="error">
        <circle cx="8" cy="8" r="6"/><path d="M8 5v3.5M8 11h.01"/>
</svg>
</div><div class="empty-title">Couldn&#x2019;t load this event</div><div class="empty-text">Check your connection and try again. Nothing was changed.</div><button type="button" class="btn" data-load-retry>Try again</button></div></div>
</template>
